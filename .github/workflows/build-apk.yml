name: Build BT Zakrepitel APK
on:
  workflow_dispatch:
  push:
    branches: [main, audio-tv-fixes]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | sort -V | tail -1)
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Audio-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download for Audio TV
        if: github.ref == 'refs/heads/audio-tv-fixes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Audio_TV_v1.3.0.apk
          if ! gh release view audio-tv-v1.3.0 >/dev/null 2>&1; then
            gh release create audio-tv-v1.3.0 Audio_TV_v1.3.0.apk --target "$GITHUB_SHA" --title "Аудио ТВ 1.3.0" --notes "Новый проект с кнопкой закрепления, предпросмотром Bluetooth-аудио, батареей при наличии данных и усилителем громкости."
          else
            gh release upload audio-tv-v1.3.0 Audio_TV_v1.3.0.apk --clobber
          fi
