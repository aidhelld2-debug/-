name: Build TV Audio Always-On APK
on:
  push:
    branches:
      - feature/tv-audio-always-on-v2
    paths:
      - 'TVVolumeBooster/**'
      - '.github/workflows/build-tv-audio-always-on.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare embedded real device photos
        run: |
          python -m pip install Pillow
          python TVVolumeBooster/scripts/prepare_product_photos.py
          find TVVolumeBooster/app/src/main/res/drawable-nodpi -type f -printf '%f %s bytes\n'
      - name: Build merged APK
        working-directory: TVVolumeBooster
        run: gradle --no-daemon clean assembleDebug
      - name: Copy APK
        run: cp TVVolumeBooster/app/build/outputs/apk/debug/app-debug.apk TV-Audio-Always-On.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Audio-Always-On-APK
          path: TV-Audio-Always-On.apk
          if-no-files-found: error
