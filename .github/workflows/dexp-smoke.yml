name: DEXP installer Android 11 smoke test

on:
  push:
    branches: [dexp-gapps-installer]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble native Android app
        run: gradle --no-daemon -p dexp-gapps-installer :app:assembleDebug
      - name: Sign APK using custom v2 signer
        run: |
          python -m pip install --quiet cryptography
          python dexp-gapps-installer/tools/sign_v2.py dexp-gapps-installer/app/build/outputs/apk/debug/app-debug.apk dexp-gapps-installer/app/build/outputs/apk/debug/app-v2-signed.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose --min-sdk-version 26 dexp-gapps-installer/app/build/outputs/apk/debug/app-v2-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dexp-installer-shell-debug
          path: dexp-gapps-installer/app/build/outputs/apk/debug/app-v2-signed.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 emulator launch check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            adb install -r dexp-gapps-installer/app/build/outputs/apk/debug/app-v2-signed.apk
            adb shell am start -n ru.dexp.gappssetup.firetools/ru.dexp.gappssetup.FireInstallerActivity
            sleep 8
            adb shell pidof ru.dexp.gappssetup.firetools | grep -E '[0-9]'
            adb logcat -d -s AndroidRuntime:E > /tmp/android_errors.txt
            ! grep -A 8 'Process: ru.dexp.gappssetup.firetools' /tmp/android_errors.txt
