plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.frolov.tvvolumebooster'
    compileSdk 35
    defaultConfig {
        // Different package from the prototype: installs alongside the already-working
        // booster without forcing removal due to GitHub Actions debug-signing key changes.
        applicationId 'ru.frolov.tvaudiocenter.louder12'
        minSdk 26
        targetSdk 32
        versionCode 3
        versionName '1.2-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
